name: Deploy Cloudflare test site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "cloudflare/**"
      - "scripts/**"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/cloudflare-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-test
      url: https://troy-anderson-website.grey-4fe.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check website and build Worker
        run: |
          pnpm exec next typegen
          pnpm lint
          pnpm typecheck
          pnpm cloudflare:build
      - name: Deploy only the test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TROY_DEPLOY_TOKEN }}
          SANITY_API_READ_TOKEN: ${{ secrets.CLOUDFLARE_SANITY_READ_TOKEN }}
          SANITY_PUBLISH_SECRET: ${{ secrets.SANITY_PUBLISH_SECRET }}
        run: |
          node -e 'const fs = require("node:fs"); for (const name of ["SANITY_API_READ_TOKEN", "SANITY_PUBLISH_SECRET"]) {if (!process.env[name]) throw new Error("Missing " + name)} fs.writeFileSync(".dev.vars", "SANITY_API_READ_TOKEN=" + process.env.SANITY_API_READ_TOKEN + "\nSANITY_PUBLISH_SECRET=" + process.env.SANITY_PUBLISH_SECRET + "\n", {mode: 0o600})'
          pnpm cloudflare:deploy:test --message "GitHub commit $GITHUB_SHA"
      - name: Verify deployed behavior
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.CLOUDFLARE_SANITY_READ_TOKEN }}
          SANITY_PUBLISH_SECRET: ${{ secrets.SANITY_PUBLISH_SECRET }}
        run: node scripts/verify-cloudflare-publishing.mjs
